#  https://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
#  Общие настройки для всех профилей. Настройки БД и прочие различия — в application-<profile>.yaml

spring:
  # Инициализация выполняется DatabaseInitializer'ом из db/init.sql
  sql:
    init:
      mode: never
  jpa:
#    show-sql: true
    open-in-view: false
    properties:
      #  http://docs.jboss.org/hibernate/orm/5.3/userguide/html_single/Hibernate_User_Guide.html#configurations
      hibernate:
        format_sql: true
        default_batch_fetch_size: 20
        # https://stackoverflow.com/questions/21257819/what-is-the-difference-between-hibernate-jdbc-fetch-size-and-hibernate-jdbc-batc
        jdbc.batch_size: 20

  # Jackson Serialization Issue Resolver
  jackson:
    visibility:
      field: any
      getter: none
      setter: none
      is-getter: none
    default-property-inclusion: non_null

  #    https://docs.spring.io/spring-boot/docs/current/reference/html/appendix-application-properties.html#common-application-properties-cache
  cache:
    cache-names: users, restaurants, result
    caffeine:
      spec: maximumSize=200,expireAfterAccess=3600s

  mvc:
    format:
      date: ${app.date-format:yyyy-MM-dd}
      time: iso
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  aop:
    proxy-target-class: false

app:
  # Формат дат в UI, JSON и привязке параметров запроса (для ISO используйте yyyy-MM-dd)
  date-format: dd.MM.yyyy

logging:
  level:
    root: WARN
    ru.ustinov.voting: INFO
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: DEBUG
#    org.springframework.security: DEBUG
#    org.springframework.orm.jpa: DEBUG
    org.springframework.web: DEBUG
    org.springframework.cache: DEBUG
#    org.springframework.transaction: DEBUG

server:
  port: 80
  servlet:
    context-path: /voting
    encoding:
      charset: UTF-8 # Charset of HTTP requests and responses. Added to the "Content-Type" header if not set explicitly
      enabled: true # Enable http encoding support
      force: true

sendMails:
  url: http://mailservise
